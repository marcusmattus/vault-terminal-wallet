  <text x="58" y="63" font-family="&#39;JetBrains Mono&#39;, monospace" font-size="18" fill="#00FF88" filter="url(#glow-sm)" font-weight="700">&gt;_</text>

  
  <circle cx="316" cy="56" r="4" fill="#00FF88" opacity="0.8"></circle>
  <circle cx="332" cy="56" r="4" fill="#00FF88" opacity="0.8"></circle>
