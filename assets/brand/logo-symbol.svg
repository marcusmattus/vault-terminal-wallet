<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="8" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="scanlines">
      <feTurbulence type="fractalNoise" baseFrequency="0 0.5" numOctaves="1" result="noise"></feTurbulence>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"></feColorMatrix>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"></feBlend>
    </filter>
    
    <radialGradient id="tGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.15"></stop>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  
  <rect width="400" height="400" fill="#050505" rx="40"></rect>

  
